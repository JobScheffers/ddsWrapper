# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:          # no branch filter -> all branches
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v6
  
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release --logger trx --results-directory "TestResults-${{ matrix.dotnet-version }}"

    - name: Upload test results
      uses: actions/upload-artifact@v6
      with:
        name: dotnet-results-${{ matrix.dotnet-version }}
        path: TestResults-${{ matrix.dotnet-version }}
      # Use always() to always run this step to publish test results when there are test failures
      if: ${{ always() }}
 
    - name: Pack
      run: dotnet pack --configuration Release /p:Version=1.0.${{github.run_number}}
      #if: github.ref == 'refs/heads/main'
      
    # Get a short-lived NuGet API key
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: sodes
      #if: github.ref == 'refs/heads/main'
    
    # Push the package
    - name: NuGet push
      run: dotnet nuget push .\ddsWrapper\bin\release\*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
      #if: github.ref == 'refs/heads/main'
  
